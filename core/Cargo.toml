[package]
name = "usbipcore"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "USB/IP server core for the Android USB/IP Gamepad Bridge"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
debug = false
strip = true
